# The readiness probe tolerates 2s: initialDelaySeconds 0 + periodSeconds 1 *
# failureThreshold 2. The app takes far longer than that to serve.
#
# The startup is deliberately long rather than merely slow, so the fixture is
# STABLE. An app that takes 30s to start is only diagnosable during a 30s window;
# capture a second late and the pod is Ready and the fixture proves nothing. A
# persistent failure is reproducible, which is what a committed fixture needs.
#
# The signal the detector keys on: readiness failing, container Running (not
# crashlooping), restart count low, probe deadline implausibly short. That
# combination means "the probe is wrong", not "the app is dead" — and the two have
# completely different fixes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow-starter
  namespace: argus-broken
spec:
  replicas: 1
  selector:
    matchLabels: {app: slow-starter}
  template:
    metadata:
      labels: {app: slow-starter}
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket: {port: 8080}
            initialDelaySeconds: 0
            periodSeconds: 1
            failureThreshold: 2
            timeoutSeconds: 1
          resources:
            requests: {memory: 16Mi, cpu: 10m}
---
apiVersion: v1
kind: Service
metadata:
  name: slow-starter
  namespace: argus-broken
spec:
  selector: {app: slow-starter}
  ports:
    - port: 80
      targetPort: 8080

# A second control, for the PDB detector specifically.
#
# Three replicas with minAvailable 1 gives disruptionsAllowed 2 — a correctly-sized budget, on a
# healthy workload, which must produce NOTHING. healthy.yaml cannot cover this: it has no PDB at
# all, so it proves only that the detector does not fire on absence, never that it does the
# arithmetic right when a budget is present and fine.
#
# A detector that fires on both this and pdb-blocks-drain.yaml is reporting "you have a PDB", which
# is not a diagnosis.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdb-roomy
  namespace: argus-broken
spec:
  replicas: 3
  selector:
    matchLabels: {app: pdb-roomy}
  template:
    metadata:
      labels: {app: pdb-roomy}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests: {memory: 16Mi, cpu: 10m}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdb-roomy
  namespace: argus-broken
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: pdb-roomy}

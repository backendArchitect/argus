# A ConfigMap that was never applied, consumed as a VOLUME rather than as environment.
#
# The sibling of missing-configmap.yaml, and the harder of the two to diagnose by hand. The env
# form at least states the problem on the container: reason=CreateContainerConfigError with the
# object named in the message. This form fails earlier, in the kubelet's mount path, and leaves the
# container on:
#
#   waiting.reason  = ContainerCreating
#   waiting.message = ""            <- empty. nothing at all.
#
# The only statement of the cause is a Warning event:
#
#   MountVolume.SetUp failed for volume "config" : configmap "absent-config" not found
#
# So the detector has to be event-gated, and cannot key on ContainerCreating, which is the normal
# state for the first seconds of every pod's life. It reports the same finding ID as the env form,
# because the object to create and the way to create it are identical — only the line of the
# manifest to look at differs.
#
# Note the event ages out after roughly an hour, after which the cluster retains no explanation of
# why this pod is stuck at all.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mount-missing-config
  namespace: argus-broken
spec:
  replicas: 1
  selector:
    matchLabels: {app: mount-missing-config}
  template:
    metadata:
      labels: {app: mount-missing-config}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          volumeMounts:
            - {name: config, mountPath: /etc/app}
          resources:
            requests: {memory: 16Mi, cpu: 10m}
      volumes:
        - name: config
          configMap: {name: absent-config}

# A PodDisruptionBudget that permits no voluntary eviction, guarding a perfectly healthy workload.
#
# One replica with minAvailable 1 leaves disruptionsAllowed permanently at 0. Nothing is wrong with
# the workload and nothing ever will be — which is exactly what makes this the cause of the
# incident that does not look like one: a node drain, cluster upgrade or autoscaler scale-down that
# hangs for hours. `kubectl drain` reports only that it cannot evict a pod, and the reason lives on
# an object nobody thinks to check because it is not broken.
#
# The health gate in the detector is the whole discriminator. EVERY broken workload also has
# disruptionsAllowed 0 — that is the budget working as intended, protecting the few healthy
# replicas left — so firing on that would add a confident distraction to every real outage.
# pdb-has-headroom.yaml is the other half of the proof: same shape, real headroom, must stay silent.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdb-pinned
  namespace: argus-broken
spec:
  replicas: 1
  selector:
    matchLabels: {app: pdb-pinned}
  template:
    metadata:
      labels: {app: pdb-pinned}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests: {memory: 16Mi, cpu: 10m}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdb-pinned
  namespace: argus-broken
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: pdb-pinned}

# An image reference that is not parseable — a second colon, as produced by pasting a tag onto an
# already-tagged image. Yields waiting.reason=InvalidImageName:
#
#   Failed to apply default image tag "nginx:1.27:latest": couldn't parse image reference
#   "nginx:1.27:latest": invalid reference format
#
# Distinct from every other image finding, and that is why it has its own ID. The kubelet rejects
# the string before contacting any registry, so there is no registry verdict to classify: the four
# pull causes (missing tag, refused credentials, rate limit, unknown) all send you to the registry
# or its credentials, and this one sends you to the manifest. Retrying and fixing imagePullSecrets
# are both wasted moves here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invalid-image
  namespace: argus-broken
spec:
  replicas: 1
  selector:
    matchLabels: {app: invalid-image}
  template:
    metadata:
      labels: {app: invalid-image}
    spec:
      containers:
        - name: app
          image: "nginx:1.27:latest"
          resources:
            requests: {memory: 16Mi, cpu: 10m}

# An HPA on a cluster with no metrics API — the autoscaler that is not autoscaling.
#
# The controller reports ScalingActive=False with reason=FailedGetResourceMetric, so it cannot
# compute a replica count and the workload is pinned wherever it happens to sit. Every object
# involved looks fine: `kubectl get hpa` lists it, the Deployment is 1/1 Ready, and the replica
# count reads as deliberate. The next traffic spike is then an outage with no proximate cause in
# any log.
#
# A warning rather than a critical, deliberately: the workload is serving right now, so this must
# never displace the critical that explains an actual outage.
#
# This fixture is also the first to exercise the HPA gather path at all. Both HPA and PDB were
# being fetched and projected on every diagnosis before these detectors existed, and read by
# nothing — the calls and the token budget were spent to reach no conclusion.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-stuck
  namespace: argus-broken
spec:
  replicas: 1
  selector:
    matchLabels: {app: hpa-stuck}
  template:
    metadata:
      labels: {app: hpa-stuck}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests: {memory: 16Mi, cpu: 10m}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-stuck
  namespace: argus-broken
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: hpa-stuck}
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 50}}

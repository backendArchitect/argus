# An envFrom reference to a ConfigMap that was never applied. Produces
# waiting.reason=CreateContainerConfigError with the kubelet's message naming the object:
#
#   configmap "checkout-config" not found
#
# This is the shape that produced ZERO findings before config.missing-reference existed. It is
# invisible to every other detector for a structural reason, not a missing string: the container
# never terminates, so it has no terminated-state reason for the crash-loop detector to read, no
# exit code, and restartCount stays 0 forever. It never runs, so the readiness detector skips it.
# It pulls its image fine, so the image detectors say nothing.
#
# The container also never starts, which means no logs exist and never will — the detector must
# not emit a log hint here, and the healthy-looking `kubectl get pods` line (0/1 Pending) is the
# whole reason this one wastes so much time during an incident.
#
# Note there is deliberately no Service: with one, endpoints.no-ready-backends would also fire
# correctly, and the fixture is here to pin THIS detector.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-config
  namespace: argus-broken
spec:
  replicas: 1
  selector:
    matchLabels: {app: missing-config}
  template:
    metadata:
      labels: {app: missing-config}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          envFrom:
            - configMapRef: {name: checkout-config}
          resources:
            requests: {memory: 16Mi, cpu: 10m}

# Captured from k8s 1.35 — the version this project's production clusters run.
#
# A rollout mid-collapse: revision 2 wants 2 replicas and has 0 ready, while revision 1 is
# down to its last serving pod. The Deployment reports 1 of 2 ready, so capacity is
# degraded and this grades CRITICAL.
#
# It is here because of what it caught. The detector used to require the WORKLOAD to be
# degraded before it would speak, and moments before this capture the same rollout sat at
# 2/2 ready — revision 1 covering every request while revision 2 could not start at all —
# and argus reported nothing wrong. That is the shape a bad deploy usually has, because a
# safe rollout strategy is designed to keep the workload up while the deploy fails. The
# e2e gate against 1.35 surfaced it; every fixture here, all captured on 1.25 where the old
# pods had already gone, agreed with the bug.
#
# The condition is now "the current ReplicaSet has replicas it should be running and fewer
# are ready", which does not care whether the workload is still covered. Severity does: a
# wedged deploy that still serves every request grades WARNING, because calling it the
# same as an outage is how a severity scale stops meaning anything.

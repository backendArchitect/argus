# HAND-AUTHORED, unlike its siblings, which are captured by hack/capture-fixtures.sh.
#
# A node reporting MemoryPressure cannot be induced reliably or safely in a local
# cluster, and inducing it on a real one is out of the question. Writing the
# snapshot by hand is legitimate precisely because model.Snapshot is plain data
# with no client in it — a hand-written snapshot is indistinguishable from a
# captured one, which is the same property that makes the whole suite clusterless.
#
# This fixture proves scope widening: two pods of this workload are failing, but
# the cause is the node, so the workload-level findings must be SUPPRESSED and a
# single node finding reported instead. Note the pods carry an OOMKilled lastState
# that would otherwise fire oomkill.limit-too-low — that is the point.
